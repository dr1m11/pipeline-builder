name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Steiger (FSD boundaries)
        run: pnpm lint:fsd
      - name: Typecheck
        run: pnpm typecheck
      - name: Claude Code hook tests
        run: pnpm test:hooks

  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Vitest with coverage thresholds
        run: pnpm test:coverage
      - name: Coverage report comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Vite production build
        run: pnpm build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @pipeline-builder/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @pipeline-builder/web exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @pipeline-builder/web exec playwright install-deps chromium

      - name: Run Playwright against the production build
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Single required status check for branch protection; add every job to `needs`.
  ci-ok:
    name: CI OK
    if: always()
    needs: [quality, test, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
